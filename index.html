    <script>
      // Ignore benign WebSocket/HMR errors in preview environment
      function isBenignWsError(text) {
        if (!text) return false;
        var lower = String(text).toLowerCase();
        return lower.includes('websocket') || lower.includes('createwebsocketmodulerunnertransport');
      }
      window.addEventListener('error', function (e) {
        if (isBenignWsError(e.message) || isBenignWsError(e.filename) || isBenignWsError(e.error && e.error.stack)) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var reasonText = e.reason && ((e.reason.message || '') + ' ' + (e.reason.stack || '') + ' ' + String(e.reason));
        if (isBenignWsError(reasonText)) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
