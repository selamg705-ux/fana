    <meta name="description" content="Ethiopian marketplace for buying and selling new and used goods across all Ethiopian regions." />
    <meta property="og:title" content="Mela Market | መላ ማርኬት — Ethiopian Marketplace" />

    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Ignore benign WebSocket/HMR errors in environment
      window.addEventListener('error', function (e) {
        if (e.message && (e.message.includes('WebSocket') || e.message.includes('createWebSocketModuleRunnerTransport'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e.reason && (e.reason.message || String(e.reason));
        if (reason && (reason.includes('WebSocket') || reason.includes('createWebSocketModuleRunnerTransport'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
